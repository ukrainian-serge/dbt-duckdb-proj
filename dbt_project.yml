name: 'jaffle_shop'
version: '1.0.0'
config-version: 2

# Configuring models
# Full documentation: https://docs.getdbt.com/docs/configuring-models

profile: 'jaffle_shop'
model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]
clean-targets:    # directories to be removed by `dbt clean`
  - "target"
  - "dbt_modules"

models:
  jaffle_shop:
    +persist_docs:
      relation: true
      columns: true

    staging:
      +materialized: view
      +static_analysis: strict
      +labels:
        layer: staging
        managed_by: dbt_dev

    marts:
      +enabled: true
      +materialized: table
      +static_analysis: strict
      +labels:
        layer: marts
        managed_by: dbt_dev

    python_demo:    # Python models not supported in Fusion CLI
      +enabled: false

seeds:
  +enabled: true

analyses:
  +enabled: true

exposures:
  +enabled: false

flags:
  require_generic_test_arguments_property: true
  latest_version_pointer_enabled_by_default: true