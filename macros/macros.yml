version: 2

macros:

  - name: string_split_array
    description: Platform-agnostic macro to split a string into an array across different data warehouses (DuckDB, Snowflake, BigQuery, Postgres).
    arguments:
      - name: string_expr
        description: The string to split (column name or expression).
      - name: delimiter
        description: The delimiter character(s) to split on (include quotes, e.g., "' '").

  - name: array_concat_string
    description: Platform-agnostic macro to concatenate array elements into a string across different data warehouses (DuckDB, Snowflake, BigQuery, Postgres).
    arguments:
      - name: array_expr
        description: The array expression to concatenate (e.g., array_slice(...) or ARRAY[...]).
      - name: delimiter
        description: The delimiter to use between elements (include quotes, e.g., "' '").

  - name: clean_stale_models
    description: Drops unused tables/views from a schema based on last modified time.
    arguments:
      - name: database
        type: string
        description: Target database (default target.database).
      - name: schema
        type: string
        description: Target schema (default target.schema).
      - name: days
        type: int
        description: Age threshold in days for cleanup (default 7).
      - name: dry_run
        type: bool
        description: Preview cleanup commands without executing (default True).

  - name: generate_schema_name
    description: Custom schema naming logic for models and functions.
    arguments:
      - name: custom_schema_name
        type: string
        description: Optional custom schema name; ignored in dev target.
      - name: node
        description: The dbt node being processed.

  - name: union_tables_by_prefix
    description: Discovers and logs tables matching a prefix pattern.
    arguments:
      - name: database
        type: string
        description: Database name.
      - name: schema
        type: string
        description: Schema name.
      - name: prefix
        type: string
        description: Table name prefix to match.
